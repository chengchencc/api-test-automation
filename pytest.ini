[pytest]
# 测试文件匹配模式
testpaths = test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行参数
addopts =
    -v
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
    --tb=short
    --show-capture=log
    --disable-warnings
    -p no:warnings

# 标记定义
markers =
    smoke: 冒烟测试
    regression: 回归测试
    performance: 性能测试
    api: API接口测试
    data_driven: 数据驱动测试
    slow: 慢速测试（执行时间超过30秒）
    db: 需要数据库的测试
    external: 依赖外部服务的测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 测试超时设置（默认5分钟）
timeout = 300
timeout_method = thread

# 缓存配置
cache_dir = .pytest_cache

# 测试执行配置
xfail_strict = true
# 失败重试
# reruns = 2
# reruns_delay = 1

# 忽略的目录
norecursedirs = .git .idea __pycache__ *.egg-info build dist

# 测试发现配置
consider_namespace_packages = false
consider_testmodule_pattern = test_*.py
consider_testdirectory_pattern = test_*

# 插件配置
junit_family = xunit2