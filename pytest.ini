[pytest]
# 测试文件匹配模式
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行参数
addopts =
    -v
    --strict-markers
    --alluredir=reports/allure-results
    --clean-alluredir
    --tb=short
    --show-capture=log
    --disable-warnings
    -p no:warnings
    --cov=src
    --cov-report=html
    --cov-report=xml

# 标记定义
markers =
    smoke: 冒烟测试
    regression: 回归测试
    performance: 性能测试
    api: API接口测试
    data_driven: 数据驱动测试
    slow: 慢速测试（执行时间超过30秒）
    db: 需要数据库的测试
    external: 依赖外部服务的测试
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    security: 安全测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/test/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s - %(filename)s:%(lineno)d - %(message)s

# 测试超时设置
timeout = 300
timeout_method = thread

# 缓存配置
cache_dir = .pytest_cache

# 测试执行配置
xfail_strict = true
# 失败重试
reruns = 0
reruns_delay = 1

# 忽略的目录
norecursedirs = .git .idea __pycache__ *.egg-info build dist .venv node_modules

# 测试发现配置
consider_namespace_packages = false
consider_testmodule_pattern = test_*.py
consider_testdirectory_pattern = test_*

# 插件配置
junit_family = xunit2
junit_suite_name = API自动化测试

# 覆盖率配置
cov_fail_under = 80
cov_report =
    term-missing
    html
    xml
cov_source =
    src

# 测试分组配置
test_group =
    smoke: tests/smoke
    api: tests/api
    regression: tests/regression
    performance: tests/performance

# 环境变量
env =
    PYTHONPATH=.
    ENV=testing
    LOG_LEVEL=INFO